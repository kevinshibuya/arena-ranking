# Local Postgres and Redis for development, tests and smoke runs.
# The project name is pinned so every worktree shares one stack: `pnpm db:up`
# from a second checkout finds these containers running and leaves them be.
# Tests and smoke runs each create their own database and Redis key prefix.
name: arena-ranking-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arena
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:63799:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
